<style>
  :root{
    --paper:#F7F6F2;
    --paper-2:#EFEDE5;

    --ink-soft:#5B6963;
    --rx-green:#146356;

    --foil-dark:#9FACAF;

  .shell{
    width:100%;
    max-width:480px;
    margin:0 auto;
    padding:calc(10px + var(--safe-top)) 18px calc(12px + var(--safe-bottom));
    display:flex;
    flex-direction:column;
    gap:9px;
  }

  /* ---------- Header / signature blister strip ---------- */
  header{
    flex-shrink:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    padding-top:0;
  }
  .strip{
    display:flex;
    gap:clamp(5px, 1.8vw, 8px);
  }
  .bead{
    width:clamp(15px, 3.9vw, 20px);
    height:clamp(15px, 3.9vw, 20px);
    border-radius:50%;
    position:relative;
  }
  .bead.full{
    background:
      radial-gradient(circle at 32% 28%, rgba(255,255,255,.85), rgba(255,255,255,0) 45%),
      linear-gradient(160deg, var(--foil), var(--foil-dark));
    box-shadow: inset 0 -2px 3px rgba(0,0,0,.12);
  }
  .bead.popped{
    background:transparent;
    border:1.6px dashed var(--foil-dark);
    opacity:.7;
  }
  h1{
    margin:0;
    font-size:clamp(19px, 4.6vw, 22px);
    font-weight:700;
    letter-spacing:-.01em;
    text-align:center;
    line-height:1.1;
  }
  .subtitle{
    margin:0;
    font-size:11.5px;
    color:var(--ink-soft);
    text-align:center;
  }

  /* ---------- Segmented mode switch ---------- */
  .segmented{
    flex-shrink:0;
    position:relative;
    display:grid;
    grid-template-columns:1fr 1fr;
    background:var(--paper-2);
    border-radius:999px;
    padding:4px;
    gap:2px;
  }
  .segmented .thumb{
    position:absolute;
    top:4px; left:4px;
    width:calc(50% - 4px);
    height:calc(100% - 8px);
    background:var(--card);
    border-radius:999px;
    box-shadow:var(--shadow-card);
    transition:transform .28s cubic-bezier(.4,0,.2,1);
    z-index:0;
  }
  .segmented.mode-1 .thumb{ transform:translateX(0); }
  .segmented.mode-2 .thumb{ transform:translateX(100%); }
  .seg-btn{
    position:relative;
    z-index:1;
    border:none;
    background:transparent;
    padding:9px 6px;
    font-family:inherit;
    font-size:13.5px;
    font-weight:600;
    color:var(--ink-soft);
    border-radius:999px;
    cursor:pointer;
    transition:color .2s ease;
    line-height:1.2;
  }
  .seg-btn[aria-pressed="true"]{ color:var(--rx-green-dark); }
  .seg-btn:focus-visible{ outline:2px solid var(--rx-green); outline-offset:2px; }

  /* ---------- Card / form ---------- */
  .card{
    flex-shrink:0;
    background:var(--card);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-card);
    padding:13px 15px;
    display:flex;
    flex-direction:column;
    gap:9px;
  }
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field label{
    font-size:13px;
    font-weight:600;
    color:var(--ink-soft);
    letter-spacing:.01em;
  }
  .input-row{
    display:flex;
    align-items:stretch;
    gap:8px;
  }
  .input-wrap{
    position:relative;
    flex:1;
    display:flex;
    align-items:center;
    background:var(--paper);
    border:1.5px solid transparent;
    border-radius:var(--radius-md);
    transition:border-color .15s ease, background .15s ease;
  }
  .input-wrap:focus-within{
    border-color:var(--rx-green);
    background:var(--card);
  }
  .input-wrap.invalid{ border-color:var(--danger); background:var(--danger-tint); }

  input[type="text"]{
    width:100%;
    border:none;
    background:transparent;
    outline:none;
    font-family:"IBM Plex Mono", ui-monospace, monospace;
    font-size:17px;
    font-weight:600;
    color:var(--ink);
    padding:10px 12px;
    -webkit-appearance:none;
  }
  .unit{
    padding-right:14px;
    font-size:13px;
    color:var(--ink-soft);
    font-weight:500;
    white-space:nowrap;
  }
  .steppers{
    display:flex;
    flex-direction:column;
    gap:5px;
  }
  .stepper-btn{
    width:36px;
    flex:1;
    border:none;
    background:var(--paper);
    color:var(--rx-green-dark);
    font-size:16px;
    font-weight:700;
    border-radius:var(--radius-sm);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background .15s ease, transform .1s ease;
  }
  .stepper-btn:active{ transform:scale(.92); background:var(--rx-green-tint); }
  .stepper-btn:focus-visible{ outline:2px solid var(--rx-green); outline-offset:1px; }

  .hint{
    font-size:11px;
    color:var(--danger);
    min-height:0;
    line-height:1.3;
    margin:0;
  }
  .hint:empty{ display:none; }

  /* ---------- LCD result panel ---------- */
  .readout{
    flex-shrink:0;
    background:
      radial-gradient(120% 140% at 15% 0%, var(--lcd-bg-2) 0%, var(--lcd-bg) 60%);
    border-radius:var(--radius-lg);
    padding:14px 16px 12px;
    color:var(--lcd-digit);
    display:flex;
    flex-direction:column;
    gap:6px;
    position:relative;
    overflow:hidden;
    cursor:pointer;
    border:none;
    text-align:left;
    width:100%;
    font-family:inherit;
  }
  .readout:focus-visible{
    outline:2px solid var(--lcd-digit);
    outline-offset:2px;
  }
  .readout::after{
    content:"";
    position:absolute;
    inset:0;
    background:repeating-linear-gradient(180deg, rgba(255,255,255,.025) 0 1px, transparent 1px 3px);
    pointer-events:none;
  }
  .readout-label{
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:rgba(124,242,196,.65);
    font-weight:600;
  }
  .readout-price{
    font-family:"IBM Plex Mono", ui-monospace, monospace;
    font-size:clamp(26px, 8.2vw, 33px);
    font-weight:700;
    letter-spacing:-.01em;
    line-height:1;
    font-variant-numeric:tabular-nums;
  }
  .readout-price span{ font-size:.45em; margin-left:6px; opacity:.75; font-weight:600; }

  .stat-divider{
    height:1px;
    background:rgba(124,242,196,.14);
    margin:0;
  }
  .stat-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
  }
  .readout-frac{
    font-family:"IBM Plex Mono", ui-monospace, monospace;
    font-size:clamp(20px, 5.5vw, 22px);
    font-weight:700;
    letter-spacing:-.01em;
    font-variant-numeric:tabular-nums;
  }
  .readout-frac span{ font-size:.5em; margin-left:6px; opacity:.7; font-weight:600; }

  .gauge-row{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .gauge{
    flex:1;
    display:flex;
    gap:3px;
    height:11px;
  }
  .gauge-cell{
    flex:1;
    border-radius:3px;
    background:rgba(124,242,196,.14);
    overflow:hidden;
    position:relative;
  }
  .gauge-cell i{
    position:absolute; inset:0;
    background:linear-gradient(180deg, #9CFAD6, #63E0AE);
    transform:scaleX(0);
    transform-origin:left;
    display:block;
  }
  .readout-note{
    font-size:11.5px;
    color:rgba(124,242,196,.55);
  }
  .readout-note:empty{ display:none; }
  .copy-flag{
    position:absolute;
    top:14px; right:16px;
    font-size:10.5px;
    font-weight:600;
    letter-spacing:.04em;
    color:rgba(124,242,196,.55);
    display:flex; align-items:center; gap:5px;
    transition:opacity .15s ease;
  }
  .copy-flag.copied{ color:#7CF2C4; }

  footer{
    flex-shrink:0;
    text-align:center;
    font-size:11px;
    color:var(--ink-soft);
    padding:0 8px 0;
    line-height:1.35;
  }
  footer b{ color:var(--ink); }

  @media (min-width:520px){
    .shell{ padding-top:calc(16px + var(--safe-top)); }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }

  .sr-only{
    position:absolute; width:1px; height:1px;
    padding:0; margin:-1px; overflow:hidden;
    clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }
</style>
</head>
<body>
<div class="shell">

  <header>
    <div class="strip" aria-hidden="true">
      <span class="bead full"></span>
      <span class="bead full"></span>
      <span class="bead full"></span>
      <span class="bead popped"></span>
      <span class="bead full"></span>
      <span class="bead full"></span>
      <span class="bead popped"></span>
      <span class="bead full"></span>
    </div>
    <h1>Фармацевтичний калькулятор</h1>
  </header>

  <div class="segmented mode-1" id="segmented">
    <div class="thumb" aria-hidden="true"></div>
    <button type="button" class="seg-btn" id="btnMode1" aria-pressed="true">Блістер / пластинка</button>
    <button type="button" class="seg-btn" id="btnMode2" aria-pressed="false">Таблетка / капсула / ампула</button>
  </div>

  <div class="card">
    <div class="field">
      <label for="inputA">Вартість цілої упаковки, грн</label>
      <div class="input-row">
        <div class="input-wrap" id="wrapA">
          <input type="text" inputmode="decimal" enterkeyhint="next" id="inputA" placeholder="0.00">
          <span class="unit">грн</span>
        </div>
      </div>
      <p class="hint" id="hintA"></p>
    </div>

    <div class="field">
      <label for="inputB" id="labelB">Кількість в упаковці</label>
      <div class="input-row">
        <div class="input-wrap" id="wrapB">
          <input type="text" inputmode="numeric" enterkeyhint="next" id="inputB" placeholder="0">
        </div>
        <div class="steppers">
          <button type="button" class="stepper-btn" data-target="inputB" data-step="1" aria-label="Збільшити">+</button>
          <button type="button" class="stepper-btn" data-target="inputB" data-step="-1" aria-label="Зменшити">−</button>
        </div>
      </div>
      <p class="hint" id="hintB"></p>
    </div>

    <div class="field">
      <label for="inputC" id="labelC">Скільки хоче клієнт</label>
      <div class="input-row">
        <div class="input-wrap" id="wrapC">
          <input type="text" inputmode="numeric" enterkeyhint="done" id="inputC" placeholder="0">
        </div>
        <div class="steppers">
          <button type="button" class="stepper-btn" data-target="inputC" data-step="1" aria-label="Збільшити">+</button>
          <button type="button" class="stepper-btn" data-target="inputC" data-step="-1" aria-label="Зменшити">−</button>
        </div>
      </div>
      <p class="hint" id="hintC"></p>
    </div>
  </div>

  <div class="readout" id="readout" role="button" tabindex="0" aria-live="polite">
    <span class="copy-flag" id="copyFlag"><span id="copyFlagText">Натисніть, щоб скопіювати</span></span>
    <span class="readout-label">Вартість для клієнта</span>
    <span class="readout-price" id="priceOut">0.00<span>грн</span></span>

    <span class="stat-divider" aria-hidden="true"></span>

    <span class="readout-label">Частка (для програми)</span>
    <span class="readout-frac" id="fracOut">0,00<span>= 0%</span></span>

    <span class="gauge-row">
      <span class="gauge" id="gauge" aria-hidden="true"></span>
    </span>
    <span class="readout-note" id="noteOut"></span>
  </div>

  <footer><b>ціна ÷ к-сть в упаковці × к-сть для клієнта</b> · Розробник — <b>Любомир Гаврищук</b></footer>

</div>

<script>
(function(){
  "use strict";

  var GAUGE_CELLS = 10;
  var gaugeEl = document.getElementById('gauge');
  for (var i=0;i<GAUGE_CELLS;i++){
    var c = document.createElement('span');
    c.className = 'gauge-cell';
    var fill = document.createElement('i');
    c.appendChild(fill);
    gaugeEl.appendChild(c);
  }
  var gaugeFills = gaugeEl.querySelectorAll('.gauge-cell i');

  var modes = {
    1: {
      key: 'blister',
      labelB: 'Блістерів / пластинок в упаковці',
      labelC: 'Блістерів / пластинок для клієнта',
      unitWord: {one:'блістер', few:'блістери', many:'блістерів'},
      defaults: {a:'455.55', b:'4', c:'2'}
    },
    2: {
      key: 'unit',
      labelB: 'Таблеток / капсул / ампул в упаковці',
      labelC: 'Скільки хоче клієнт',
      unitWord: {one:'таблетку', few:'таблетки', many:'таблеток'},
      defaults: {a:'555.26', b:'60', c:'25'}
    }
  };

  var state = {
    mode: 1,
    values: {
      1: null,
      2: null
    }
  };

  var els = {
    segmented: document.getElementById('segmented'),
    btn1: document.getElementById('btnMode1'),
    btn2: document.getElementById('btnMode2'),
    labelB: document.getElementById('labelB'),
    labelC: document.getElementById('labelC'),
    a: document.getElementById('inputA'),
    b: document.getElementById('inputB'),
    c: document.getElementById('inputC'),
    wrapA: document.getElementById('wrapA'),
    wrapB: document.getElementById('wrapB'),
    wrapC: document.getElementById('wrapC'),
    hintA: document.getElementById('hintA'),
    hintB: document.getElementById('hintB'),
    hintC: document.getElementById('hintC'),
    priceOut: document.getElementById('priceOut'),
    fracOut: document.getElementById('fracOut'),
    noteOut: document.getElementById('noteOut'),
    readout: document.getElementById('readout'),
    copyFlag: document.getElementById('copyFlag'),
    copyFlagText: document.getElementById('copyFlagText')
  };

  function loadStored(){
    try{
      var raw = localStorage.getItem('farmcalc_state_v1');
      if(!raw) return null;
      return JSON.parse(raw);
    }catch(e){ return null; }
  }
  function saveStored(){
    try{
      localStorage.setItem('farmcalc_state_v1', JSON.stringify(state));
    }catch(e){}
  }

  function parseNum(str){
    if (str === undefined || str === null) return NaN;
    var s = String(str).trim().replace(',', '.');
    if (s === '') return NaN;
    var n = parseFloat(s);
    return n;
  }

  function fmt(n, decimals){
    // Manual formatting (no Intl/toLocaleString) — some mobile WebViews
    // (in-app browsers, older Android) lack full locale data for "uk-UA"
    // and throw, which used to blank out the whole result panel.
    decimals = decimals || 0;
    if (!isFinite(n)) n = 0;
    var neg = n < 0;
    n = Math.abs(n);
    var fixed = n.toFixed(decimals);
    var dot = fixed.indexOf('.');
    var intPart = dot === -1 ? fixed : fixed.slice(0, dot);
    var decPart = dot === -1 ? '' : fixed.slice(dot + 1);
    intPart = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, '\u00A0');
    return (neg ? '-' : '') + intPart + (decPart ? ',' + decPart : '');
  }

  function currentValues(){
    return { a: els.a.value, b: els.b.value, c: els.c.value };
  }

  function setInvalid(wrapEl, hintEl, msg){
    wrapEl.classList.toggle('invalid', !!msg);
    hintEl.textContent = msg || '';
  }

  function recalc(){
    try{
      return recalcInner();
    }catch(e){
      try{
        els.priceOut.innerHTML = '0,00<span>грн</span>';
        els.fracOut.innerHTML = '0,00<span>= 0%</span>';
        els.noteOut.textContent = 'Заповніть усі поля коректно';
      }catch(e2){}
      return { a:0, b:0, c:0, price:0, fraction:0, valid:false };
    }
  }

  function recalcInner(){
    var a = parseNum(els.a.value);
    var b = parseNum(els.b.value);
    var c = parseNum(els.c.value);

    var okA = els.a.value.trim() === '' || (isFinite(a) && a >= 0);
    var okB = els.b.value.trim() === '' || (isFinite(b) && b >= 0);
    var okC = els.c.value.trim() === '' || (isFinite(c) && c >= 0);

    setInvalid(els.wrapA, els.hintA, okA ? '' : 'Введіть число ≥ 0');
    setInvalid(els.wrapB, els.hintB, okB ? '' : 'Введіть число ≥ 0');
    setInvalid(els.wrapC, els.hintC, okC ? '' : 'Введіть число ≥ 0');

    var zeroPack = (els.b.value.trim() !== '' && b === 0);
    setInvalid(els.wrapB, els.hintB, zeroPack ? 'Не може дорівнювати 0' : (okB ? '' : 'Введіть число ≥ 0'));

    var validForMath = okA && okB && okC && !zeroPack && isFinite(a) && isFinite(b) && isFinite(c) && b > 0;

    var price = 0, fraction = 0;
    if (validForMath){
      price = (a / b) * c;
      fraction = c / b;
    }

    els.priceOut.innerHTML = fmt(price, 2) + '<span>грн</span>';

    var pct = fraction * 100;
    els.fracOut.innerHTML = fmt(fraction, 2) + '<span>= ' + fmt(Math.min(pct,9999), pct < 10 ? 1 : 0) + '%</span>';

    var fillRatio = Math.max(0, Math.min(1, fraction));
    var exactCells = fillRatio * GAUGE_CELLS;
    for (var i=0;i<GAUGE_CELLS;i++){
      var cellFill = Math.max(0, Math.min(1, exactCells - i));
      gaugeFills[i].style.transform = 'scaleX(' + cellFill + ')';
    }

    var note = '';
    if (validForMath && fraction > 1.0001){
      note = '= ' + fmt(fraction,2).replace(/\.00$/, '') + ' упаковки за цією ціною';
    } else if (!validForMath){
      note = 'Заповніть усі поля коректно';
    }
    els.noteOut.textContent = note;

    return { a:a, b:b, c:c, price:price, fraction:fraction, valid: validForMath };
  }

  function applyMode(mode, opts){
    opts = opts || {};
    state.mode = mode;
    var m = modes[mode];
    els.segmented.className = 'segmented mode-' + mode;
    els.btn1.setAttribute('aria-pressed', mode === 1 ? 'true' : 'false');
    els.btn2.setAttribute('aria-pressed', mode === 2 ? 'true' : 'false');
    els.labelB.textContent = m.labelB;
    els.labelC.textContent = m.labelC;

    var vals = state.values[mode] || m.defaults;
    els.a.value = vals.a;
    els.b.value = vals.b;
    els.c.value = vals.c;

    recalc();
    if (!opts.silent) saveStored();
  }

  function persistCurrentInputs(){
    state.values[state.mode] = currentValues();
    saveStored();
  }

  els.btn1.addEventListener('click', function(){ if(state.mode!==1){ persistCurrentInputs(); applyMode(1);} });
  els.btn2.addEventListener('click', function(){ if(state.mode!==2){ persistCurrentInputs(); applyMode(2);} });

  [els.a, els.b, els.c].forEach(function(input){
    input.addEventListener('input', function(){
      recalc();
      persistCurrentInputs();
    });
    input.addEventListener('focus', function(){ this.select(); });
  });

  // Enter/Go on the keyboard: move to the next field, and on the last
  // field dismiss the keyboard instead of doing nothing.
  var fieldOrder = [els.a, els.b, els.c];
  fieldOrder.forEach(function(input, idx){
    input.addEventListener('keydown', function(e){
      if (e.key !== 'Enter') return;
      e.preventDefault();
      var next = fieldOrder[idx + 1];
      if (next){
        next.focus();
      } else {
        input.blur();
      }
    });
  });

  document.querySelectorAll('.stepper-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      var targetId = btn.getAttribute('data-target');
      var step = parseInt(btn.getAttribute('data-step'), 10);
      var input = document.getElementById(targetId);
      var cur = parseNum(input.value);
      if (!isFinite(cur)) cur = 0;
      var next = Math.max(0, cur + step);
      input.value = String(next);
      recalc();
      persistCurrentInputs();
    });
  });

  var copyTimer = null;
  els.readout.addEventListener('click', function(){
    var r = recalc();
    if (!r.valid) return;
    var text = fmt(r.price,2) + ' грн · частка ' + fmt(r.fraction,2);
    var done = function(){
      els.copyFlag.classList.add('copied');
      els.copyFlagText.textContent = 'Скопійовано ✓';
      clearTimeout(copyTimer);
      copyTimer = setTimeout(function(){
        els.copyFlag.classList.remove('copied');
        els.copyFlagText.textContent = 'Натисніть, щоб скопіювати';
      }, 1400);
    };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done).catch(done);
    } else {
      done();
    }
  });
  els.readout.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar'){
      e.preventDefault();
      els.readout.click();
    }
  });

  // init
  var stored = loadStored();
  if (stored && stored.values){
    state = stored;
  }
  applyMode(state.mode || 1, {silent:true});

  // Clean up any service worker registered by an earlier version of this
  // file — it was registered from a temporary Blob URL and could serve a
  // stale cached copy of the page on reopen, which is what caused the
  // result panel to render blank for some users.
  if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations){
    navigator.serviceWorker.getRegistrations().then(function(regs){
      regs.forEach(function(r){ r.unregister(); });
    }).catch(function(){});
  }
  if (window.caches && caches.keys){
    caches.keys().then(function(keys){
      keys.forEach(function(k){ if (k.indexOf('farmcalc') === 0) caches.delete(k); });
    }).catch(function(){});
  }
})();
</script>
</body>
</html>
